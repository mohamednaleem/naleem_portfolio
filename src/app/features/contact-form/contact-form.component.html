<form class="contact-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="row">
    <label class="field">
      <span>Your name</span>
      <input type="text" formControlName="name" autocomplete="name" [attr.aria-invalid]="showError('name')" aria-describedby="name-error">
      @if (showError('name')) { <small id="name-error" class="error">Please enter your name.</small> }
    </label>
    <label class="field">
      <span>Work email</span>
      <input type="email" formControlName="email" autocomplete="email" [attr.aria-invalid]="showError('email')" aria-describedby="email-error">
      @if (showError('email')) { <small id="email-error" class="error">Please enter a valid email address.</small> }
    </label>
  </div>
  <label class="field">
    <span>Company &amp; role <em>(optional)</em></span>
    <input type="text" formControlName="company" autocomplete="organization" placeholder="e.g. Acme Bank · Senior Full Stack Developer">
  </label>
  <label class="field">
    <span>Message</span>
    <textarea formControlName="message" rows="4" placeholder="Tell me about the role, team, location and next steps…" [attr.aria-invalid]="showError('message')" aria-describedby="message-error"></textarea>
    @if (showError('message')) { <small id="message-error" class="error">Please write at least 10 characters.</small> }
  </label>

  <div class="form-foot">
    <button type="submit" class="button button-primary" [disabled]="status() === 'sending'">
      {{ status() === 'sending' ? 'SENDING…' : 'SEND MESSAGE' }} <svg lucideSend size="15"></svg>
    </button>
    <p class="form-status" role="status" aria-live="polite">
      @switch (status()) {
        @case ('sent') { {{ endpoint() ? 'Thanks! Your message has been sent.' : 'Your email app should open with the message ready to send.' }} }
        @case ('error') { Something went wrong — please email {{ email() }} directly. }
      }
    </p>
  </div>
</form>
