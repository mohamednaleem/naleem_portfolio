  <script>
    // Apply the saved theme (light by default) before first paint to avoid a flash.
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('naleem.theme');
        if (saved === 'light' || saved === 'dark') { theme = saved; }
      } catch (e) { /* storage unavailable: keep default */ }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
