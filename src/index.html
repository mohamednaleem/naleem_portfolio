<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mohamed Naleem | Senior Full Stack Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mohamed Naleem is a Senior Full Stack Developer (Angular, React, Node.js, MERN) with 12+ years of experience building enterprise applications across banking, healthcare, telecom, and SaaS.">
  <meta property="og:title" content="Mohamed Naleem | Senior Full Stack Developer">

  <meta property="og:type" content="website">

  <link rel="canonical" href="https://mohamednaleem.github.io/naleem_portfolio/">
  <meta name="theme-color" content="#09080d">
  <script>
    // Apply the saved or system theme before first paint to avoid a flash.
    (function () {
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('naleem.theme');
        if (saved === 'light' || saved === 'dark') { theme = saved; }
        else if (window.matchMedia('(prefers-color-scheme: light)').matches) { theme = 'light'; }
      } catch (e) { /* storage unavailable: keep default */ }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
