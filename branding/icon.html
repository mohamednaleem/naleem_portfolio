<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Source for public/apple-touch-icon.png (?size=180) and icon-512.png (?size=512). -->
  <style>
    html, body { margin: 0; overflow: hidden; }
    body { display: grid; width: var(--s, 180px); height: var(--s, 180px); place-items: center; background: linear-gradient(135deg, #6d3fd1, #c2459f); font-family: 'Segoe UI', Arial, sans-serif; }
    span { color: #fff; font-size: calc(var(--s, 180px) * .4); font-weight: 800; letter-spacing: -.04em; }
    i { color: #fff; font-style: normal; }
  </style>
  <script>
    document.documentElement.style.setProperty('--s', (Number(new URLSearchParams(location.search).get('size')) || 180) + 'px');
  </script>
</head>
<body><span>MN<i>.</i></span></body>
</html>
