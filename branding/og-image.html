<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Source for public/og-image.png (1200x630). Render with headless Chrome: --screenshot --window-size=1200,630 -->
  <style>
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 90px;
      box-sizing: border-box;
      color: #1b1526;
      background:
        radial-gradient(circle at 85% 20%, rgba(194, 69, 159, .18), transparent 40%),
        radial-gradient(circle at 10% 90%, rgba(109, 63, 209, .2), transparent 45%),
        #f8f6fc;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .mark { position: absolute; top: 60px; left: 90px; font-size: 34px; font-weight: 800; letter-spacing: -1px; }
    .mark span { color: #6d3fd1; }
    .hello { margin: 0 0 10px; color: #655e75; font-size: 22px; letter-spacing: 6px; }
    h1 {
      margin: 0;
      background: linear-gradient(120deg, #1b1526 40%, #6d3fd1 80%, #c2459f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: 92px;
      font-weight: 800;
      letter-spacing: 4px;
      line-height: 1.05;
    }
    .role { margin: 18px 0 30px; color: #463f55; font-size: 30px; font-weight: 600; }
    .tags { display: flex; gap: 12px; }
    .tags span { padding: 10px 20px; border: 2px solid rgba(109, 63, 209, .3); border-radius: 999px; color: #6d3fd1; background: #fff; font-size: 22px; font-weight: 700; }
    .url { position: absolute; right: 90px; bottom: 56px; color: #655e75; font-size: 22px; }
  </style>
</head>
<body>
  <div class="mark">MN<span>.</span></div>
  <p class="hello">HELLO, I’M</p>
  <h1>MOHAMED NALEEM</h1>
  <p class="role">Senior Full Stack Developer · 12+ years · Banking &amp; Healthcare</p>
  <div class="tags"><span>Angular</span><span>React</span><span>Node.js</span><span>MongoDB</span><span>Oracle</span></div>
  <div class="url">mohamednaleem.github.io/naleem_portfolio</div>
</body>
</html>
